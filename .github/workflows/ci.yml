name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type-check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

      - name: Validate the documentation contract
        # The design documents are a contract an agent implementer builds against: this
        # checks every schema, replays the transcripts against them, and verifies that
        # every operation and error code named in the prose actually exists.
        run: python tools/validate-docs.py

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        # Builds only, so a broken Dockerfile fails a pull request rather than a release.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: winshow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id winshow:ci -u)"
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: Verify the bundled dependency licence texts survived
        # THIRD-PARTY-NOTICES.md promises these remain present in the published image,
        # and the MIT, BSD and Apache-2.0 terms require it of a redistributor. A future
        # image-slimming change that deletes them fails here rather than silently.
        run: |
          count="$(docker run --rm --entrypoint sh winshow:ci -c \
            'find /opt/venv -path "*.dist-info*" -iname "LICENSE*" -o -path "*.dist-info*" -iname "COPYING*" | wc -l')"
          echo "found $count bundled licence files"
          test "$count" -gt 0 || { echo "no dependency licence texts in the image"; exit 1; }

      - name: Verify the server starts and answers liveness
        run: |
          docker run -d --name winshow-smoke -p 8080:8080 \
            -e WINSHOW_AGENT_TOKENS="$(head -c 48 /dev/urandom | base64 | tr -d '=+/' | cut -c1-40)" \
            winshow:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthz is green"
              # /readyz must be red with no agent connected: that is the distinction the
              # whole health split exists for.
              code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)"
              test "$code" = "503" || { echo "readyz should be 503 with no agent, got $code"; exit 1; }
              echo "readyz correctly reports 503 with no agent"
              docker rm -f winshow-smoke
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          docker logs winshow-smoke
          exit 1
