name: Release

# Publishes the container image to the GitHub Container Registry.
#
# Two triggers, publishing two different things.
#
# A version tag publishes a release: semver tags plus `latest`. Tagging is what marks a
# commit as intended for consumption.
#
# A push to main publishes `edge` — the current state of the branch, explicitly not a
# release. Without it nothing would exist in the registry until somebody cut the first
# tag, and "the image is published by CI" would be true only in principle. `edge` never
# moves `latest`, so pulling `latest` still gets you a released version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside the computed ones"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path; github.repository preserves the owner's casing, so
  # it cannot be used directly for tmueller-dev/WinShow.
  IMAGE_NAME: tmueller-dev/winshow

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python tools/validate-docs.py

  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    # Publishing follows the checks rather than racing them. CI runs the same steps on
    # every push, but a tag can point at any commit, so the gate has to be here too:
    # an image nobody has linted or tested is not worth putting in a registry.
    needs: [verify]
    permissions:
      contents: read
      packages: write
      # Both are needed for build provenance attestation.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=WinShow
            org.opencontainers.image.description=MCP server brokering a Windows host that dials out

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and provenance make the AGPL's source obligation auditable: a
          # recipient can see exactly which dependencies and which commit produced the
          # image they are running.
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
